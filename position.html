<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Position</title>
</head>
<body style="height: 1000px; padding-left: 100px;">

    <div style="background-color: black; color: white;
    position: fixed; top: 0px; left: 0px; right: 0px; height: 50px; z-index: 1;">header</div>

    <div style="background-color: green; color: white; position: fixed; left: 0; bottom: 0; width: 72px;
    top: 50px;">
      Sidebar
    </div> 


    <div style="background-color: blue; position: absolute; color: white;
    ">absolute</div>

  <div style="background-color: lightblue; height: 200px; width: 200px; margin-top: 30px;">Div 1</div>
  <div style="background-color: red; height: 200px; width: 200px;">Div 2</div>
  <button style="color: blue; border-color: blue;">Sign in</button>
</body>
</html>
